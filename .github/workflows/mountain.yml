name: Actualizar boletines de montaña y tráfico DGT
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/mountain.yml', '*.js', '*.css', '*.html', 'img/**']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: mountain-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Comprobar aplicación
        run: |
          npm install --ignore-scripts
          npm test
          python3 tests/alerts.test.py
          python3 tests/dgt.test.py
      - name: Obtener boletines oficiales
        run: |
          python3 scripts/update-mountain.py
          python3 scripts/update-alerts.py
          python3 scripts/update-dgt.py || true
      - name: Preparar web
        run: |
          mkdir -p public/data
          cp *.html *.css *.js *.png manifest.webmanifest public/
          cp -r img public/
          cp data/*.json public/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
